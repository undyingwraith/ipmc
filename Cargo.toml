[workspace]
resolver = "3"
members = [
	"packages/tauri-app/src-tauri",
	"packages/node",
]

[workspace.dependencies]
tokio = "^1.54.1"
serde = { version = "^1.0.229", features = ["derive"] }
rust-ipfs = { version = "0.16.0", features = ["pnet", "routing"] }
libp2p = { version = "0.56.0" }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
